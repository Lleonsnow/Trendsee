services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trendsee
      POSTGRES_PASSWORD: trendsee
      POSTGRES_DB: trendsee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://trendsee:trendsee@postgres:5432/trendsee
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change_me
      JWT_ALG: HS256
      JWT_EXPIRE_MINUTES: 720
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

